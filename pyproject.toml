[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcpmon"
version = "0.2.0"
description = "Monitor de conexões TCP por autômatos (AFD, autômato temporizado e agregador) para detecção de intrusão"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "dpkt==1.9.8",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
lab = ["scapy==2.8.0"]
dev = ["pytest==9.2.0"]

[project.scripts]
tcpmon = "tcpmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
